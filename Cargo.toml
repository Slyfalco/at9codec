[workspace]
resolver = "2"
members = ["crates/at9codec", "crates/at9cli"]

[workspace.package]
version = "2.1.0"
edition = "2021"
# MIT with an attribution requirement (not plain MIT), so point at the file.
license-file = "LICENSE"
repository = "https://github.com/Slyfalco/at9codec"
authors = ["Slyfalco"]

# Optimised release: the codec is DSP-heavy, so build it fast.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
