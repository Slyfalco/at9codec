name: Build shared libraries

# Builds the at9codec shared library (cdylib) for every supported OS/arch and
# publishes them as a single GitHub release. Each runner builds its own native
# target — the library is pure Rust with no C dependencies, so no cross-compiler,
# emulation or Rosetta is needed (the Intel-mac build runs on a native Intel
# runner).
#
# Run it by pushing a version tag (v1.0, …) or from the Actions tab
# ("Run workflow", optionally set a tag; defaults to "libs-latest"). The release
# gets both the individual libraries and a combined `at9codec-native-libs.zip`
# laid out as `native/<os>-<arch>/<lib>`, ready to drop into an embedding app.

on:
  push:
    tags:
      - 'v*'
      - 'libs-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish the libraries under'
        required: false
        default: 'libs-latest'

permissions:
  contents: write   # create/update the release

jobs:
  build:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    # Non-blocking: if a runner is unavailable/flaky (GitHub's ARM or older macOS
    # images come and go), that platform is skipped rather than failing the whole
    # run — the release still publishes the platforms that built, and you can make
    # a missing one locally (scripts/build-libs.ps1) or by re-running.
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,  target: x86_64-pc-windows-msvc,    tag: windows-x64,   lib: at9codec.dll }
          - { os: windows-latest,  target: i686-pc-windows-msvc,      tag: windows-x86,   lib: at9codec.dll }
          - { os: windows-11-arm,  target: aarch64-pc-windows-msvc,   tag: windows-arm64, lib: at9codec.dll }
          - { os: ubuntu-latest,   target: x86_64-unknown-linux-gnu,  tag: linux-x64,     lib: libat9codec.so }
          - { os: ubuntu-latest,   target: i686-unknown-linux-gnu,    tag: linux-x86,     lib: libat9codec.so }
          - { os: ubuntu-24.04-arm,target: aarch64-unknown-linux-gnu, tag: linux-arm64,   lib: libat9codec.so }
          # Both macOS libs build on macos-15 (the only reliably-provisioned image;
          # macos-13/14 don't schedule for this account). x64 cross-compiles from the
          # arm64 runner — pure Rust + the universal Apple SDK, no Rosetta needed.
          - { os: macos-15,        target: aarch64-apple-darwin,      tag: macos-arm64,   lib: libat9codec.dylib }
          - { os: macos-15,        target: x86_64-apple-darwin,       tag: macos-x64,     lib: libat9codec.dylib }
    steps:
      - uses: actions/checkout@v4

      - name: Linux 32-bit toolchain
        # The i686 Linux target needs the 32-bit C runtime/linker to produce the .so.
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} -p at9codec

      - name: Test (host-arch)
        # Runs the host-arch build of the tests; validates the code on every runner
        # (the cross-compiled x86_64 mac lib is covered by the arm64 run of the same code).
        run: cargo test --release -p at9codec

      - name: Stage library
        shell: bash
        run: |
          mkdir -p "stage/native/${{ matrix.tag }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" \
             "stage/native/${{ matrix.tag }}/${{ matrix.lib }}"
          # On Windows also keep the import library for linking from C/C++.
          if [ -f "target/${{ matrix.target }}/release/at9codec.dll.lib" ]; then
            cp "target/${{ matrix.target }}/release/at9codec.dll.lib" \
               "stage/native/${{ matrix.tag }}/at9codec.dll.lib"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.tag }}
          path: stage/native/${{ matrix.tag }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    # always(): publish whatever platforms built, even if a flaky runner skipped one
    # (continue-on-error makes build "succeed"; this guards the rare total-failure case).
    if: ${{ always() && github.repository == 'Slyfalco/at9codec' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all libraries
        uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          path: incoming

      - name: Assemble the native/ tree and assets
        shell: bash
        run: |
          mkdir -p native assets
          if ! ls incoming/lib-* >/dev/null 2>&1; then
            echo "::error::no platform artifacts were produced — all build jobs failed."
            exit 1
          fi
          # download-artifact lays each one out as incoming/lib-<tag>/<files>.
          for d in incoming/lib-*; do
            tag="${d#incoming/lib-}"
            mkdir -p "native/$tag"
            cp "$d"/* "native/$tag/"
            # A flat, clearly-named copy for one-off downloads.
            for f in "$d"/*; do
              base="$(basename "$f")"
              case "$base" in
                *.dll.lib) cp "$f" "assets/at9codec-$tag.dll.lib" ;;
                at9codec.dll)      cp "$f" "assets/at9codec-$tag.dll" ;;
                libat9codec.so)    cp "$f" "assets/libat9codec-$tag.so" ;;
                libat9codec.dylib) cp "$f" "assets/libat9codec-$tag.dylib" ;;
              esac
            done
          done
          # Per-os/arch zip assets (the format the embedding app fetches): each
          # holds that platform's lib(s) + the header + license, flat.
          for d in native/*/; do
            tag="$(basename "$d")"
            tmp="$(mktemp -d)"
            cp "$d"/* "$tmp"/
            cp include/at9codec.h LICENSE "$tmp"/
            ( cd "$tmp" && zip -r - . ) > "assets/at9codec-$tag.zip"
            rm -rf "$tmp"
          done
          # Ship the header + license alongside the libs.
          cp include/at9codec.h native/at9codec.h
          cp LICENSE native/LICENSE
          # Combined archive laid out exactly as an embedding app's native/ dir.
          ( cd native && zip -r ../assets/at9codec-native-libs.zip . )
          ls -R native
          ls -l assets

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload libraries to the (manually created) release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Releases are created by hand so a human writes the description. This job
          # only uploads the lib assets (--clobber replaces same-named assets and
          # leaves the release body untouched) — it never creates or overwrites a
          # release. Fail clearly if the release doesn't exist yet.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release '$TAG' does not exist. Create it (tag $TAG, with its description) on GitHub first, then re-run this workflow. It never creates a release."
            exit 1
          fi
          gh release upload "$TAG" assets/* --clobber
